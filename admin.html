<!-- Modal: Add Exercise -->
    <div id="exercise-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto" dir="rtl">
        <div class="bg-white dark:bg-slate-800 w-full max-w-2xl rounded-3xl p-6 shadow-2xl space-y-4 my-8">
            <div class="flex justify-between items-center border-b pb-3 border-slate-100 dark:border-slate-700">
                <h3 class="text-lg font-bold text-emerald-600">إضافة تمرين تفاعلي للدرس</h3>
                <button type="button" onclick="previewExerciseContent()" class="text-xs bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-lg font-semibold hover:bg-emerald-100 transition"><i class="fa-solid fa-eye ml-1"></i> معاينة التمرين</button>
            </div>

            <!-- شريط الإدراج الرياضي السريع للتمارين -->
            <div class="bg-slate-50 dark:bg-slate-700/50 p-2.5 rounded-2xl border border-slate-200 dark:border-slate-600 space-y-1.5">
                <div class="text-[11px] font-bold text-slate-500 dark:text-slate-300">إدراج سريع داخل السؤال أو الخيار النشط:</div>
                <div class="flex flex-wrap gap-1.5" dir="ltr">
                    <button type="button" onclick="insertMathSnippet('$\\frac{}{}$', 7)" class="px-2.5 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg text-xs font-bold hover:bg-indigo-50 transition">كسر $\frac{a}{b}$</button>
                    <button type="button" onclick="insertMathSnippet('$\\sqrt{}$', 7)" class="px-2.5 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg text-xs font-bold hover:bg-indigo-50 transition">جذر $\sqrt{x}$</button>
                    <button type="button" onclick="insertMathSnippet('$\\sqrt[]{}$', 7)" class="px-2.5 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg text-xs font-bold hover:bg-indigo-50 transition">جذر نوني $\sqrt[n]{x}$</button>
                    <button type="button" onclick="insertMathSnippet('$^{}$', 3)" class="px-2.5 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg text-xs font-bold hover:bg-indigo-50 transition">أس $x^n$</button>
                    <button type="button" onclick="insertMathSnippet('$\\left(  \\right)$', 8)" class="px-2.5 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg text-xs font-bold hover:bg-indigo-50 transition">أقواس $( )$</button>
                    <button type="button" onclick="insertMathSnippet('$\\setminus$', 10)" class="px-2.5 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg text-xs font-bold hover:bg-indigo-50 transition">$\setminus$</button>
                    <button type="button" onclick="insertMathSnippet('$\\times$', 7)" class="px-2.5 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg text-xs font-bold hover:bg-indigo-50 transition">$\times$</button>
                    <button type="button" onclick="insertMathSnippet('$\\div$', 5)" class="px-2.5 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg text-xs font-bold hover:bg-indigo-50 transition">$\div$</button>
                    <label class="px-2.5 py-1 bg-indigo-600 text-white rounded-lg text-xs font-bold cursor-pointer hover:bg-indigo-700 transition">
                        <i class="fa-solid fa-image ml-1"></i> صورة
                        <input type="file" accept="image/*" onchange="handleExerciseImageUpload(event)" class="hidden">
                    </label>
                </div>
            </div>

            <input type="hidden" id="ex-grade-id">
            <input type="hidden" id="ex-book-id">
            <input type="hidden" id="ex-unit-id">
            <input type="hidden" id="ex-lesson-id">
            <div>
                <label class="block text-sm font-medium mb-1">نص السؤال</label>
                <textarea id="ex-question" rows="3" placeholder="اكتب نص السؤال أو الصق رسمة/معادلة (Ctrl + V)..." class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none font-mono" dir="rtl" onfocus="activeExField = this" onpaste="handleDirectPaste(event, 'ex-question')"></textarea>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <textarea id="ex-opt0" rows="2" placeholder="الخيار الأول" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none font-mono" dir="rtl" onfocus="activeExField = this" onpaste="handleDirectPaste(event, 'ex-opt0')"></textarea>
                <textarea id="ex-opt1" rows="2" placeholder="الخيار الثاني" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none font-mono" dir="rtl" onfocus="activeExField = this" onpaste="handleDirectPaste(event, 'ex-opt1')"></textarea>
                <textarea id="ex-opt2" rows="2" placeholder="الخيار الثالث" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none font-mono" dir="rtl" onfocus="activeExField = this" onpaste="handleDirectPaste(event, 'ex-opt2')"></textarea>
                <textarea id="ex-opt3" rows="2" placeholder="الخيار الرابع" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none font-mono" dir="rtl" onfocus="activeExField = this" onpaste="handleDirectPaste(event, 'ex-opt3')"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">الإجابة الصحيحة</label>
                <select id="ex-correct" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm">
                    <option value="0">الخيار الأول</option>
                    <option value="1">الخيار الثاني</option>
                    <option value="2">الخيار الثالث</option>
                    <option value="3">الخيار الرابع</option>
                </select>
            </div>
            <div class="p-3 bg-emerald-50/50 dark:bg-slate-700/30 rounded-2xl border border-emerald-100 dark:border-slate-700 space-y-2">
                <span class="text-xs font-bold text-emerald-700 dark:text-emerald-400">معاينة السؤال والخيارات:</span>
                <div id="live-exercise-preview" class="p-3 bg-white dark:bg-slate-800 rounded-xl min-h-[50px] text-sm space-y-2" dir="rtl" style="text-align: right; direction: rtl;">اضغط "معاينة التمرين" لرؤية المعادلات والرسوم...</div>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button onclick="closeExerciseModal()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-sm">إلغاء</button>
                <button onclick="saveLessonExercise()" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-sm font-medium">حفظ التمرين</button>
            </div>
        </div>
    </div>
